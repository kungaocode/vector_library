# Qwen cloud annotation + local BGE-M3 embeddings + local PostgreSQL.
# The supplied Token Plan endpoint accepts qwen3.8-flash chat requests,
# but returned HTTP 404 for text-embedding-v4 on 2026-10-25.
[project]
sources_dir = "F:/vector_library/documents/inbox"
sources_dirs = [
  "F:/vector_library/documents/inbox",
  "F:/vector_library/shared/documents/inbox",
  "F:/vector_library/shared/code",
]

[database]
backend = "postgres"
host = "127.0.0.1"
port = 5432
name = "vector_library"
user = "windows_writer"
namespace = "knowledge_qwen_bge_m3"
credentials_file = "F:/vector_library/secrets/credentials.json"
credentials_account = "windows"

[chunking]
max_chars = 1200
overlap_chars = 180

[enrichment]
provider = "openai-compatible"
model = "qwen3.8-flash"
api_url = "https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1/chat/completions"
api_key_env = "KVLIB_QWEN_API_KEY"
api_key_file = "F:/vector_library/secrets/qwen-token-plan.key"
timeout_s = 90
max_tokens = 512

[embedding]
provider = "ollama"
model = "bge-m3:latest"
dimension = 1024
api_url = "http://127.0.0.1:11434/api/embed"
timeout_s = 180
batch_size = 8

[retrieval]
mode = "hybrid"
top_k = 8
candidate_k = 40
lexical_weight = 0.35
